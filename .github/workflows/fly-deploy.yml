name: Fly Deploy

# Deployt die App bei jedem Push auf main automatisch nach Fly.io.
# Voraussetzung (einmalig): Repo-Secret FLY_API_TOKEN setzen.
#   Token erzeugen:  fly tokens create deploy -a parteiwiki
#   GitHub:          Settings -> Secrets and variables -> Actions -> New secret
#                    Name: FLY_API_TOKEN, Value: <Token>

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy app
    runs-on: ubuntu-latest
    concurrency:
      group: fly-deploy
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
