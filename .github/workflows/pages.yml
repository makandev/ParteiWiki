name: Statische Vorschau auf GitHub Pages

# Veröffentlicht den committeten Ordner docs/ (statische Vorschau der UI) auf
# GitHub Pages. Voraussetzung: Repo-Einstellungen -> Pages -> Source: "GitHub
# Actions". Die funktionsfähige App (Suche/RAG/DB) läuft NICHT auf Pages –
# dafür das Container-Deployment (siehe DEPLOY.md).

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
