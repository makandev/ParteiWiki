services:
  db:
    image: pgvector/pgvector:pg16
    container_name: parteiwiki-db
    environment:
      POSTGRES_USER: parteiwiki
      POSTGRES_PASSWORD: parteiwiki
      POSTGRES_DB: parteiwiki
    ports:
      - "5432:5432"
    volumes:
      - parteiwiki_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U parteiwiki"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: parteiwiki-web
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://parteiwiki:parteiwiki@db:5432/parteiwiki
      # Scharfe Backends (Default). Für sbert stattdessen EMBEDDER=sbert + EMBEDDING_DIM=384.
      EMBEDDER: spacy_vectors
      EMBEDDING_DIM: "300"
      NER: spacy
      SPACY_MODEL: de_core_news_md
      LLM: extractive
      ENV: production
      SEED_ON_START: "1"
    ports:
      - "8000:8000"

volumes:
  parteiwiki_pgdata:
