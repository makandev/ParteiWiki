# fly.toml app configuration file generated for parteiwiki on 2026-08-30T12:52:06Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'parteiwiki'
primary_region = 'fra'

[build]

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  checks = [{ grace_period = '45s', interval = '15s', method = 'GET', path = '/health', timeout = '5s' }]

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512

[[vm]]
  memory = '2gb'
  cpu_kind = 'shared'
  cpus = 4
  memory_mb = 2048
  processes = ['app']
  size = 'shared-cpu-4x'
