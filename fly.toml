# Fly.io-Konfiguration für ParteiWiki (App-Container).
# Die Datenbank-URL wird von Fly als Secret DATABASE_URL injiziert (Managed
# Postgres) und von der App automatisch auf das SQLAlchemy-Dialekt-Präfix
# normalisiert. Die Backend-Defaults (spaCy-Vektoren, 300 Dim) stecken im Image.
#
# Hinweis: Der App-Name ist global eindeutig – falls "parteiwiki" vergeben ist,
# hier (oder im Launch-Dialog) einen anderen Namen wählen.

app = "parteiwiki"
primary_region = "fra"

[build]

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "45s"
    method = "GET"
    path = "/health"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
