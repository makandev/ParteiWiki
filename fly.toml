# fly.toml app configuration file generated for parteiwiki on 2026-08-30T12:53:04Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'parteiwiki'
primary_region = 'fra'

[build]

[http_service]
  internal_port = 8000
  force_https = true
  # Immer >=1 Maschine an, damit der Auto-Ingestion-Scheduler dauerhaft läuft
  # (für "immer live"). Zum Kostensparen auf true / 0 zurückstellen – dann läuft
  # Ingestion nur, während die App wach ist.
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  checks = [{ grace_period = '45s', interval = '15s', method = 'GET', path = '/health', timeout = '5s' }]

[env]
  # Auto-Ingestion alle 60 Minuten (0 = aus).
  INGEST_INTERVAL_MINUTES = '60'

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 2
  memory_mb = 1024
  processes = ['app']
  size = 'shared-cpu-2x'
